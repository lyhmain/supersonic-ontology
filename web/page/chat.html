<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KB-RAG 知识库 - 知识问答</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f5f6fa; color: #2f3542; height: 100vh; display: flex; flex-direction: column; }
  .topbar { background: #3742fa; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  .topbar b { font-size: 16px; }
  .topbar .sid { font-family: monospace; font-size: 12px; opacity: .85; }
  .topbar button { background: rgba(255,255,255,.18); color: #fff; border: none; border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; margin-left: 8px; }
  .main { flex: 1; display: flex; overflow: hidden; }
  .sidebar { width: 215px; background: #fff; border-right: 1px solid #e4e9f2; padding: 12px 10px; overflow-y: auto; flex-shrink: 0; }
  .newbtn { width: 100%; background: #f0f3ff; color: #3742fa; border: 1px dashed #91a7ff; border-radius: 8px; padding: 8px; font-size: 13px; cursor: pointer; margin-bottom: 10px; }
  .newbtn:hover { background: #e4eaff; }
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tab { flex: 1; text-align: center; font-size: 12.5px; padding: 6px 0; border-radius: 8px; cursor: pointer; background: #f1f2f6; color: #57606f; user-select: none; }
  .tab.active { background: #3742fa; color: #fff; }
  .pane { display: none; } .pane.active { display: block; }
  .doc { padding: 8px 10px; border-radius: 8px; font-size: 12.5px; cursor: pointer; margin-bottom: 5px; color: #5b6478; border: 1px solid transparent; }
  .doc:hover { background: #f1f2f6; }
  .doc.active { background: #f0fdf7; border-color: #0e9f6e; color: #0e9f6e; }
  .doc .n { font-weight: 600; word-break: break-all; }
  .sess { padding: 8px 10px; border-radius: 8px; font-size: 12.5px; cursor: pointer; margin-bottom: 5px; color: #5b6478; position: relative; }
  .sess:hover { background: #f1f2f6; }
  .sess.active { background: #eef3ff; color: #3742fa; }
  .sess .del { position: absolute; right: 8px; top: 8px; color: #b2bec3; display: none; cursor: pointer; }
  .sess:hover .del { display: inline; }
  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .fb { margin-top: 8px; font-size: 14px; }
  .fb span { cursor: pointer; margin-right: 8px; opacity: .55; }
  .fb span:hover { opacity: 1; }
  .fb .done { color: #0e9f6e; font-size: 12px; }
  .msg { margin-bottom: 16px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: #3742fa; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.05); border-bottom-left-radius: 4px; position: relative; }

  /* 进度步骤条 chips */
  .steps-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .step { font-size: 11.5px; border-radius: 12px; padding: 2px 10px; border: 1px solid #dcdde1; color: #b2bec3; background: #fafafa; transition: all .2s; }
  .step.done { color: #0e9f6e; border-color: #9adfc5; background: #f0fdf7; }
  .step.doing { color: #3742fa; border-color: #91a7ff; background: #f0f3ff; animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  /* thinking 折叠块 */
  .think { margin-bottom: 8px; border-left: 3px solid #d5dbe8; padding: 4px 10px; background: #f7f8fc; border-radius: 6px; }
  .think summary { cursor: pointer; font-size: 12px; color: #8395a7; user-select: none; outline: none; }
  .think .tbody { font-size: 12px; color: #9aa3b8; white-space: pre-wrap; max-height: 220px; overflow-y: auto; margin-top: 4px; }

  /* 正文内引用角标 */
  .cite { display: inline-block; background: #eef3ff; color: #3742fa; border-radius: 6px; font-size: 11px; padding: 0 5px; margin: 0 2px; cursor: pointer; vertical-align: super; line-height: 1.5; }
  .cite:hover { background: #3742fa; color: #fff; }

  /* 悬浮引用卡 */
  #pop { position: fixed; z-index: 99; max-width: 380px; background: #fff; border: 1px solid #dfe4ee; border-radius: 10px; box-shadow: 0 8px 30px rgba(20,30,60,.18); padding: 12px 14px; font-size: 12.5px; line-height: 1.65; display: none; }
  #pop .p-doc { color: #3742fa; font-weight: 600; margin-bottom: 4px; }
  #pop .p-path { color: #8395a7; font-size: 11px; margin-bottom: 6px; word-break: break-all; }
  #pop .p-text { color: #5b6478; }

  /* 底部来源列表 */
  .refs { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #e1e1e1; font-size: 12px; color: #8395a7; }
  .refs span { display: inline-block; background: #f1f2f6; border-radius: 6px; padding: 2px 8px; margin: 2px 4px 0 0; cursor: pointer; }
  .refs span:hover { background: #eef3ff; color: #3742fa; }

  .composer { background: #fff; border-top: 1px solid #e1e1e1; padding: 14px 20px; }
  .composer .inner { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  textarea { flex: 1; resize: none; border: 1px solid #dcdde1; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-family: inherit; height: 46px; outline: none; }
  textarea:focus { border-color: #3742fa; }
  button.send { background: #3742fa; color: #fff; border: none; border-radius: 10px; padding: 0 22px; font-size: 14px; cursor: pointer; }
  button.send:disabled { background: #a4b0be; cursor: not-allowed; }
  .typing::after { content: "▌"; animation: blink 1s infinite; color: #3742fa; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="topbar">
  <b>KB-RAG 知识库 · 知识问答</b>
  <div>
    <span class="sid" id="sid"></span>
    <button onclick="clearHistory()">清空会话</button>
    <a href="/import.html" style="color:#fff; font-size:12px; margin-left:8px;">导入文档</a>
  </div>
</div>

<div id="chat"><div class="wrap" id="list"></div></div>
<div id="pop"></div>

<div class="composer">
  <div class="inner">
    <textarea id="input" placeholder="输入问题，Enter 发送（Shift+Enter 换行）"></textarea>
    <button class="send" id="send">发送</button>
  </div>
</div>
</div>
</div>

<script>
const NODE_NAMES = {
  node_product_confirm: "意图路由",
  node_vector_search: "混合检索",
  node_hyde: "HyDE 召回",
  node_web_search: "联网搜索",
  node_fusion: "融合去重",
  node_rerank: "重排打分",
  node_answer: "生成答案",
  node_refuse: "范围拦截",
};
const NODE_ORDER = Object.keys(NODE_NAMES);
const $ = (id) => document.getElementById(id);
let sessionId = localStorage.getItem("kb_session") || ("s_" + Math.random().toString(36).slice(2, 14));
localStorage.setItem("kb_session", sessionId);
$("sid").textContent = "会话: " + sessionId;
let busy = false;
let lastRefs = [];   // 当前 bot 消息的引用（悬浮卡数据源）

$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("send").addEventListener("click", send);

function bubble(cls, html) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = html;
  div.appendChild(b);
  $("list").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
  return b;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

/* ---------- 引用悬浮卡 ---------- */
const pop = $("pop");
function showPop(n, anchor) {
  const ref = lastRefs.find((r) => r.index === n);
  if (!ref) return;
  pop.innerHTML = `<div class="p-doc">[${ref.index}] ${esc(ref.doc_name || "来源")}</div>` +
    (ref.title_path ? `<div class="p-path">📁 ${esc(ref.title_path)}</div>` : "") +
    `<div class="p-text">${esc((ref.chunk_text || "").slice(0, 260))}${(ref.chunk_text || "").length > 260 ? "…" : ""}</div>`;
  pop.style.display = "block";
  const rect = anchor.getBoundingClientRect();
  pop.style.left = Math.min(rect.left, window.innerWidth - 400) + "px";
  pop.style.top = Math.min(rect.bottom + 8, window.innerHeight - 180) + "px";
}
function hidePop() { pop.style.display = "none"; }
document.addEventListener("click", hidePop);

/* 正文文本 → 悬浮引用角标渲染（[n] 仅当存在于 refs 中） */
function renderAnswer(answer, refs) {
  const idxSet = new Set(refs.map((r) => r.index));
  const safe = esc(answer);
  return safe.replace(/\[(\d{1,2})\]/g, (m, n) =>
    idxSet.has(+n) ? `<span class="cite" data-n="${n}">[${n}]</span>` : m);
}

/* 悬浮卡事件委托（含历史消息） */
document.addEventListener("mouseover", (e) => {
  const t = e.target.closest(".cite");
  if (t) showPop(+t.dataset.n, t);
});
document.addEventListener("mouseout", (e) => {
  if (e.target.closest && e.target.closest(".cite")) hidePop();
});

function refsHtml(refs) {
  if (!refs.length) return "";
  return `<div class="refs">📎 来源（点击角标看原文）：${refs.map(r =>
    `<span data-n="${r.index}">[${r.index}] ${esc(r.doc_name || "")}${r.title_path ? " · " + esc(r.title_path.split("/").pop()) : ""}</span>`).join("")}</div>`;
}

/* 历史消息 [n] 渲染悬浮卡：需要临时切换 lastRefs */
async function loadHistory() {
  const resp = await fetch(`/api/chat/history/${sessionId}?limit=50`);
  const data = await resp.json();
  for (const item of data.items) {
    if (item.role === "user") { bubble("user", esc(item.content)); continue; }
    lastRefs = item.refs || [];
    const b = bubble("bot", renderAnswer(item.content || "", lastRefs) + refsHtml(lastRefs));
    b.insertAdjacentHTML("beforeend", "");
  }
  lastRefs = [];
}

/* ---------- 进度步骤条 ---------- */
function renderSteps(stepsEl, doneSet, current) {
  stepsEl.innerHTML = NODE_ORDER.map((k) => {
    if (doneSet.has(k)) return `<span class="step done">✔ ${NODE_NAMES[k]}</span>`;
    if (k === current) return `<span class="step doing">⏳ ${NODE_NAMES[k]}</span>`;
    return `<span class="step">${NODE_NAMES[k]}</span>`;
  }).join("");
}

async function send() {
  const text = $("input").value.trim();
  if (!text || busy) return;
  busy = true;
  $("send").disabled = true;
  $("input").value = "";
  lastRefs = [];

  bubble("user", esc(text));
  const botBubble = bubble("bot",
    `<div class="steps-bar"></div>` +
    `<details class="think" open><summary>💭 深度思考</summary><div class="tbody"></div></details>` +
    `<span class="typing"></span>`);
  const stepsEl = botBubble.querySelector(".steps-bar");
  const thinkEl = botBubble.querySelector(".tbody");
  const thinkBox = botBubble.querySelector(".think");
  const textEl = botBubble.querySelector("span");
  renderSteps(stepsEl, new Set(), NODE_ORDER[0]);
  const t0 = Date.now();
  let thinkLen = 0;

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: text, session_id: sessionId, is_stream: true, doc_name: selectedDoc }),
    });
    if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buf = "", answer = "", refs = [];
    const doneSet = new Set();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const frames = buf.split("\n\n");
      buf = frames.pop();
      for (const frame of frames) {
        const evLine = frame.split("\n").find((l) => l.startsWith("event: "));
        const dataLine = frame.split("\n").find((l) => l.startsWith("data: "));
        if (!evLine || !dataLine) continue;
        const ev = evLine.slice(7).trim();
        const data = JSON.parse(dataLine.slice(6));

        if (ev === "progress") {
          (data.done_list || []).forEach((k) => doneSet.add(k));
          const current = NODE_ORDER.find((k) => !doneSet.has(k)) || "";
          renderSteps(stepsEl, doneSet, current);
        } else if (ev === "thinking") {
          thinkLen += data.text.length;
          thinkEl.textContent += data.text;
          thinkEl.scrollTop = thinkEl.scrollHeight;
          thinkBox.querySelector("summary").textContent =
            `💭 深度思考中…（${thinkLen} 字，点击折叠）`;
          $("chat").scrollTop = $("chat").scrollHeight;
        } else if (ev === "delta") {
          if (thinkBox.open) { thinkBox.open = false; }
          textEl.classList.add("typing");
          answer += data.text;
          textEl.textContent = answer;
          $("chat").scrollTop = $("chat").scrollHeight;
        } else if (ev === "final") {
          answer = data.answer || answer;
          refs = data.refs || [];
        } else if (ev === "error") {
          throw new Error(data.error);
        }
      }
    }
    /* 最终渲染：折叠思考 + 正文角标化 + 来源列表 */
    lastRefs = refs;
    thinkBox.open = false;
    thinkBox.querySelector("summary").textContent =
      thinkLen ? `💭 已深度思考（${thinkLen} 字 · ${((Date.now() - t0) / 1000).toFixed(1)}s，点击展开）` : "";
    if (!thinkLen) thinkBox.remove();
    textEl.classList.remove("typing");
    textEl.outerHTML = `<div class="ansbody">${renderAnswer(answer || "（无返回内容）", refs)}</div>`;
    if (refs.length) botBubble.insertAdjacentHTML("beforeend", refsHtml(refs));
    if (answer && !answer.includes("没有找到")) botBubble.insertAdjacentHTML("beforeend",
      `<div class="fb"><span onclick="sendFeedback(this,'up')" title="回答准确">👍</span><span onclick="sendFeedback(this,'down')" title="回答有误">👎</span></div>`);
    botBubble.querySelector(".steps-bar").remove();
  } catch (e) {
    textEl.classList.remove("typing");
    textEl.innerHTML = `<span style="color:#e74c3c">出错了：${esc(String(e))}</span>`;
  } finally {
    busy = false;
    $("send").disabled = false;
    $("chat").scrollTop = $("chat").scrollHeight;
  }
}

async function clearHistory() {
  await fetch(`/api/chat/history/${sessionId}`, { method: "DELETE" });
  $("list").innerHTML = "";
}

/* ---------- 侧栏 Tab ---------- */
function switchTab(which) {
  $("tabSess").classList.toggle("active", which === "sess");
  $("tabDoc").classList.toggle("active", which === "doc");
  $("paneSess").classList.toggle("active", which === "sess");
  $("paneDoc").classList.toggle("active", which === "doc");
}

/* ---------- 文件目录（点选 = 限定检索范围） ---------- */
let selectedDoc = "";
async function loadDocs() {
  try {
    const data = await (await fetch("/api/import/docs")).json();
    $("doclist").innerHTML = (data.items || []).map((d) => `
      <div class="doc ${selectedDoc === d.doc_name ? "active" : ""}" onclick="toggleDoc('${encodeURIComponent(d.doc_name)}', this)">
        <div class="n">📄 ${esc(d.doc_name)}</div>
        <div style="color:#b2bec3; font-size:11px; margin-top:2px;">${d.chunks} 切片</div>
      </div>`).join("");
  } catch (e) { $("doclist").innerHTML = '<span style="color:#e74c3c; font-size:12px;">加载失败</span>'; }
}
function toggleDoc(encoded, el) {
  const name = decodeURIComponent(encoded);
  selectedDoc = (selectedDoc === name) ? "" : name;
  document.querySelectorAll("#doclist .doc").forEach((x) => x.classList.remove("active"));
  if (selectedDoc) {
    el.classList.add("active");
    $("input").placeholder = `已限定《${name}》，输入问题…`;
  } else {
    $("input").placeholder = "输入问题，Enter 发送（Shift+Enter 换行）";
  }
}

/* ---------- 多会话管理 ---------- */
async function loadSessions() {
  const resp = await fetch("/api/chat/sessions");
  const data = await resp.json();
  $("sesslist").innerHTML = (data.items || []).map((s) => `
    <div class="sess ${s.session_id === sessionId ? "active" : ""}" onclick="switchSession('${s.session_id}')">
      <div style="font-weight:600">${esc(s.last_content || s.session_id)}</div>
      <div style="color:#b2bec3; font-size:11px; margin-top:2px">${s.msg_count} 条 · ${s.last_active.slice(5, 16).replace("T", " ")}</div>
      <span class="del" title="删除会话" onclick="delSession(event,'${s.session_id}')">✕</span>
    </div>`).join("");
}
function switchSession(sid) {
  sessionId = sid;
  localStorage.setItem("kb_session", sid);
  $("sid").textContent = "会话: " + sid;
  $("list").innerHTML = "";
  loadHistory();
  loadSessions();
}
function newSession() {
  sessionId = "s_" + Math.random().toString(36).slice(2, 14);
  localStorage.setItem("kb_session", sessionId);
  $("sid").textContent = "会话: " + sessionId;
  $("list").innerHTML = "";
  loadSessions();
}
async function delSession(e, sid) {
  e.stopPropagation();
  await fetch(`/api/chat/history/${sid}`, { method: "DELETE" });
  if (sid === sessionId) newSession(); else loadSessions();
}

/* ---------- 反馈回流 ---------- */
async function sendFeedback(el, rating) {
  const box = el.closest(".msg");
  const texts = box.querySelectorAll(".ansbody, .bubble");
  const answer = (box.querySelector(".ansbody") || box.querySelector(".bubble")).innerText;
  const userMsgs = document.querySelectorAll(".msg.user .bubble");
  const question = userMsgs[userMsgs.length - 1] ? userMsgs[userMsgs.length - 1].innerText : "";
  const resp = await fetch("/api/chat/feedback", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, question, answer, rating }),
  });
  el.closest(".fb").innerHTML = '<span class="done">已反馈 ✓（用于优化评测）</span>';
}

loadHistory();
loadSessions();
loadDocs();

// 深链支持:/chat.html?q=<问题> —— 打开即自动发送(供 SuperSonic 聊天「流式追问」跳转)
(function () {
  const q = new URLSearchParams(location.search).get("q");
  if (q && q.trim()) {
    // 等历史/会话加载完成后填入并发送
    setTimeout(() => {
      $("input").value = q.trim();
      send();
    }, 400);
  }
})();
</script>
</body>
</html>
